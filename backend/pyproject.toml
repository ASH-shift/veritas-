[project]
name = "veritas"
version = "0.1.0"
description = "Agentic RAG Knowledge Copilot"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",

    # Cache
    "redis>=5.0.0",

    # LLM
    "groq>=0.11.0",

    # Embeddings & reranking (local, CPU, free)
    "fastembed>=0.3.6",

    # Document loaders
    "pypdf>=4.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # Logging
    "python-json-logger>=2.0.7",

    # Agent
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # Observability (optional — gracefully absent)
    "langfuse>=2.0.0",

    # MCP
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "fpdf2>=2.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP042: keep `(str, enum.Enum)` for SQLAlchemy Enum columns rather than StrEnum.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
