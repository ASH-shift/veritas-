name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (core modules)
        run: mypy app/core app/db app/api
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  eval-gate:
    name: Eval gate — faithfulness regression
    needs: backend
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@localhost:5432/veritas
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas
          POSTGRES_DB: veritas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veritas" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not set — skipping eval gate."
      - uses: actions/checkout@v4
        if: env.GROQ_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install, migrate, ingest
        if: env.GROQ_API_KEY != ''
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python -m app.ingestion.pipeline --docs-dir ../sample_docs --workspace-id 1
      - name: Run 20-question eval subset
        if: env.GROQ_API_KEY != ''
        run: python -m evals.run_evals --config hybrid_rerank --limit 20
      - name: Compare against committed baseline
        if: env.GROQ_API_KEY != ''
        run: python -m evals.gate --config hybrid_rerank
